name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: juice:test

      - name: Test CLI and CSS inlining
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm juice:test --help
          docker run --rm juice:test --version
          printf '%s\n' '<p>Hello Juice</p>' | docker run --rm -i juice:test - - > output.html
          cat output.html
          grep -Eq '<p>Hello Juice</p>' output.html
          printf '%s\n' '<style>p { color: red; }</style><p>Hello Juice</p>' \
            | docker run --rm -i juice:test - - > output.html
          cat output.html
          grep -Eq '<p style="color: red;">Hello Juice</p>' output.html
          rm output.html

      - name: Docker image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: drdpham/juice
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
